# DisasterMaps: 3 tiers físicos + EIS. Modo demo: solo la Web publica puerto al host.
#   docker compose up --build            -> http://localhost:5001
#   docker compose --profile tools run --rm simulator --event-id <uuid> --count 20 --interval 2
# Modo dev (además publica Business 5002 con Scalar y Postgres 5432):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
name: disastermaps

x-tcp-check: &tcp-check
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: disastermaps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disastermaps"]
      interval: 5s
      timeout: 3s
      retries: 20

  data:                                   # Tier 3 Datos: gRPC h2c en 5003
    build:
      context: .
      dockerfile: src/DisasterMaps.Data/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development  # aplica migraciones y carga la semilla de ejemplo
      ASPNETCORE_HTTP_PORTS: "5003"
      ConnectionStrings__DisasterMaps: Host=postgres;Port=5432;Database=disastermaps;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *tcp-check
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5003"]

  business:                               # Tier 2 Negocio: REST /api/v1 en 5002
    build:
      context: .
      dockerfile: src/DisasterMaps.Business/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DataTier__UseFake: "false"
      DataTier__Address: http://data:5003
      DataTier__DeadlineSeconds: "3"
    depends_on:
      data:
        condition: service_healthy
    healthcheck:
      <<: *tcp-check
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5002 && printf 'GET /alive HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3"]

  web:                                    # Tier 1 Presentación: MVC + Leaflet en 5001
    build:
      context: .
      dockerfile: src/DisasterMaps.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "5001"
      Business__UseFake: "false"
      Business__BaseUrl: http://business:5002
    ports:
      - "5001:5001"
    depends_on:
      business:
        condition: service_healthy
    healthcheck:
      <<: *tcp-check
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5001"]

  simulator:                              # Dispositivo de campo; solo con --profile tools
    profiles: ["tools"]
    build:
      context: .
      dockerfile: src/DisasterMaps.Simulator/Dockerfile
    environment:
      SIM_BUSINESS_URL: http://business:5002
    depends_on:
      business:
        condition: service_healthy

volumes:
  pgdata:
